[package]
name = "pytools-core"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[dependencies]
anyhow.workspace = true
chrono.workspace = true
csv.workspace = true
encoding_rs.workspace = true
excel-editor = { path = "../crates/excel-editor" }
excel-reader = { path = "../crates/excel-reader" }
excel-writer = { path = "../crates/excel-writer" }
ooxml-patch = { path = "../crates/ooxml-patch" }
rayon.workspace = true
roxmltree.workspace = true
rust_xlsxwriter.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
umya-spreadsheet.workspace = true
zip.workspace = true

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_System_Ole",
    "Win32_System_ProcessStatus",
        "Win32_System_Threading",
    "Win32_System_Variant",
    "Win32_UI_WindowsAndMessaging",
] }
windows-sys = { workspace = true, features = ["Win32_System_Com", "Win32_System_Ole", "Win32_UI_Controls_Dialogs", "Win32_UI_Shell", "Win32_UI_Shell_Common"] }

[dev-dependencies]
serde_json.workspace = true
