[workspace]
resolver = "2"
members = [
    "crates/excel-reader",
    "crates/excel-writer",
    "crates/excel-editor",
    "crates/ooxml-patch",
    "pytools-core",
]
# vendor 修改版不作为成员（依赖图独立），仅通过 [patch.crates-io] 生效。
exclude = [
    "vendor/betteroffice-xlsx-model",
    "vendor/betteroffice-xlsx-calc",
]

[workspace.package]
edition = "2021"
license = "MIT"

[workspace.dependencies]
anyhow = "1"
libc = "0.2"
axum = "0.8"
calamine = "=0.37.0"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
clap = { version = "4", features = ["derive"] }
csv = "1"
encoding_rs = "0.8"
rayon = "1"
roxmltree = "0.21"
rust_xlsxwriter = "=0.101.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.10"
sha2 = "0.10"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread"] }
umya-spreadsheet = "=3.1.1"
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem"] }
zip = "6"


# vendor 修改版 betteroffice 计算引擎（见 vendor/VENDOR_NOTES.md）：
# 修复 used_range 被纯样式空格撑大 + 重算预算上限可配置。
[patch.crates-io]
betteroffice-xlsx-model = { path = "vendor/betteroffice-xlsx-model" }
betteroffice-xlsx-calc = { path = "vendor/betteroffice-xlsx-calc" }
