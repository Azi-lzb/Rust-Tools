[package]
name = "xls2x-bench"
version = "0.1.0"
edition = "2021"
publish = false
description = "Standalone XLS to XLSX conversion feasibility benchmark: excel_com vs rxls vs calamine+rust_xlsxwriter"

# 独立于根 workspace：本工程只做 XLS→XLSX 转换可行性实测，
# 不参与 pytools 生产构建，不修改生产依赖。
[workspace]

[dependencies]
anyhow = "1"
calamine = "=0.37.0"
clap = { version = "4", features = ["derive"] }
rust_xlsxwriter = "=0.101.0"
rxls = "=0.1.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_System_Ole",
    "Win32_System_ProcessStatus",
    "Win32_System_Threading",
    "Win32_System_Variant",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
debug = false
