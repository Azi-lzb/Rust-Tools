[package]
name = "betteroffice-modification-audit"
version = "0.1.0"
edition = "2021"
publish = false

[workspace]
resolver = "2"

[dependencies]
anyhow = "=1.0.104"
betteroffice-xlsx = "=0.5.1"
betteroffice-xlsx-ops = "=0.5.1"
betteroffice-xlsx-model = "=0.5.1"
rust_xlsxwriter = "=0.101.0"
serde_json = "=1.0.154"
zip = { version = "=6.0.0", default-features = false, features = ["deflate"] }

[patch.crates-io]
betteroffice-xlsx-model = { path = "../../../../vendor/betteroffice-xlsx-model" }
betteroffice-xlsx-calc = { path = "../../../../vendor/betteroffice-xlsx-calc" }

[profile.release]
debug = false
